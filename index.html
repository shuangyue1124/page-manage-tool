<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人导航页：个人工具 · 网页管理 · 开发资源，数据由 JSON 驱动，脚本维护，Cloudflare Pages 自动构建。" />
  <title>我的导航</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235e6ad2'/%3E%3Cpath d='M16 8l6.5 16h-3.2L17.6 19h-3.2l-1.7 5H9.5L16 8zm0 5.1L14.5 16.6h3L16 13.1z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- 顶部品牌光晕（参考 Linear 首页的柔和 radial 渐变） -->
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="20" height="20"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M16 8l6.5 16h-3.2L17.6 19h-3.2l-1.7 5H9.5L16 8zm0 5.1L14.5 16.6h3L16 13.1z" fill="#fff"/></svg>
      </span>
      <span class="brand-title" id="site-title">我的导航</span>
    </div>

    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="搜索链接…" autocomplete="off" spellcheck="false" aria-label="搜索链接" />
      <kbd class="search-kbd">/</kbd>
    </div>

    <div class="actions">
      <button id="theme-toggle" class="icon-btn" type="button" title="切换主题 (T)" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a id="github-link" class="icon-btn" href="#" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="GitHub 仓库">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.1 11.1 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12v3.14c0 .3.21.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
      </a>
    </div>
  </header>

  <nav class="cat-nav" id="cat-nav" aria-label="分类导航"></nav>

  <main id="main" class="main">
    <div class="loading" id="loading">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在加载导航数据…</p>
    </div>
    <div class="error hidden" id="error">
      <p id="error-msg">数据加载失败</p>
      <button id="retry-btn" class="btn" type="button">重试</button>
    </div>
    <div class="empty hidden" id="empty">
      <p class="empty-icon" aria-hidden="true">🔍</p>
      <p id="empty-text">没有匹配的链接</p>
      <p class="empty-hint">试试其他关键词，或按 Esc 清空</p>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <template id="card-tpl">
    <a class="card" target="_blank" rel="noopener noreferrer">
      <span class="card-icon">
        <img alt="" loading="lazy" />
        <span class="card-icon-fallback" aria-hidden="true"></span>
      </span>
      <span class="card-body">
        <span class="card-title">
          <span class="card-title-text"></span>
          <svg class="card-link-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </span>
        <span class="card-desc"></span>
        <span class="card-tags"></span>
      </span>
    </a>
  </template>

  <script src="assets/app.js"></script>
</body>
</html>
